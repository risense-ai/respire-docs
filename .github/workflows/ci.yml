name: Docs CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
      - name: Ensure docs index exists
        run: test -s docs/README.md
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate cross-repo contracts
        run: node contracts/validate.mjs
      - name: Install documentation dependencies
        run: npm ci
      - name: Build VitePress documentation
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: docs-${{ github.sha }}
          path: docs/.vitepress/dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: markdown
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-${{ github.sha }}
          path: docs-dist
      - name: Package the built documentation
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::expected a stable version tag"; exit 1; }
          mkdir release-assets
          tar -czf "release-assets/respire-docs-${RELEASE_TAG}.tar.gz" -C docs-dist .
          printf '%s\n' "$GITHUB_SHA" > release-assets/docs-sha.txt
          (cd release-assets && sha256sum *.tar.gz docs-sha.txt > SHA256SUMS)
      - name: Publish static documentation without deploying a website
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$RELEASE_TAG" --notes "Built documentation; Pages and production deployment are not part of this workflow."

  cleanup-receipt:
    needs: [markdown, publish]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record the completed producer and delivery inventory
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 .github/scripts/cleanup_artifacts.py stamp
      - uses: actions/upload-artifact@v4
        with:
          name: cleanup-ready-v1
          path: ${{ runner.temp }}/cleanup-ready.json
          retention-days: 1
          if-no-files-found: ignore
